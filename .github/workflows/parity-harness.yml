name: Parity harness regressions

on: pull_request

permissions:
  contents: read

jobs:
  fault-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 test/test_parity.py -v
      - uses: actions/checkout@v4
        with:
          repository: starkware-libs/sequencer
          ref: ffdf1f9e1485753ccc35b860b24dfdc68fe8bf45
          sparse-checkout: echonet
          path: _sequencer
      - name: Verify offline job profiles and refusal checkpoints
        run: |
          python3 -m venv "$RUNNER_TEMP/echonet-env"
          "$RUNNER_TEMP/echonet-env/bin/pip" install zstandard==0.25.0
          "$RUNNER_TEMP/echonet-env/bin/python" test/whole_os_job_smoke.py _sequencer

  native-smoke:
    runs-on: ubuntu-24.04
    env:
      OXCAML_SWITCH: 5.2.0+ox
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/oxcaml
      - name: Build OxCairo
        run: opam exec --switch "$OXCAML_SWITCH" -- dune build --profile release bin/main.exe
      - uses: actions/checkout@v4
        with:
          repository: starkware-libs/cairo-vm
          ref: 3c3f112d8a40ec465bde6b59e2c659df39b7dbc6 # v4.0.0
          path: _rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _rust
      - name: Build pinned Rust CLI
        working-directory: _rust
        run: cargo build --locked --release -p cairo-vm-cli
      - name: Check real execution and reviewed rejections
        run: |
          rust=_rust/target/release/cairo-vm-cli
          vm=_build/default/bin/main.exe
          python3 test/parity.py "$rust" "$vm" test/parity_fixtures/core \
            --expect-rejections test/parity_fixtures/core-rejections.json --verbose
          python3 test/parity.py "$rust" "$vm" test/parity_fixtures/malformed \
            --expect-rejections test/parity_fixtures/malformed-rejections.json --verbose
      - uses: actions/checkout@v4
        with:
          repository: starkware-libs/formal-proofs
          ref: d0dd8279612a248cbc6bf6d286030bf0bb2a37ff
          path: _lean-model
      - name: Build the pinned Lean execution semantics and check three-way agreement
        env:
          LEAN_CAIRO_MODEL: ${{ github.workspace }}/_lean-model
          LEAN_NUM_THREADS: '3'
        run: |
          sudo apt-get update && sudo apt-get install -y elan
          test/lean/prepare.sh
          python3 test/lean/check.py _rust/target/release/cairo-vm-cli _build/default/bin/main.exe
