# Build, test and publish OxCairo binaries for a version tag (vX.Y.Z).
# Cut a release with scripts/release.sh X.Y.Z, which checks versions and pushes the tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  OXCAML_SWITCH: 5.2.0+ox

jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - name: Create the release from the CHANGELOG section
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "OxCairo $v" --notes-file notes.md

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos-arm64 }
          - { os: ubuntu-24.04, target: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }

      - uses: ./.github/actions/oxcaml

      - name: Install optional macOS backends
        if: runner.os == 'macOS'
        run: |
          brew install libdeflate openssl@3
          echo "OXC_OPENSSL=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OXC_LIBDEFLATE=$(brew --prefix libdeflate)" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          eval $(opam env --switch "$OXCAML_SWITCH")
          dune build --profile release
          dune test --profile release

      - name: Train macOS release binary
        if: runner.os == 'macOS'
        run: |
          eval "$(opam env --switch "$OXCAML_SWITCH")"
          python3 scripts/build_pgo.py --jobs 2 --output _build/release-cli
          _build/release-cli --version

      - name: Package and upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          name="oxcairo-${TAG}-${{ matrix.target }}"
          cli=_build/default/bin/main.exe
          if [ "$RUNNER_OS" = macOS ]; then cli=_build/release-cli; fi
          python3 scripts/package_release.py "$TAG" "${{ matrix.target }}" "$cli" --output-dir .
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" --clobber
