site_name: OxCairo
site_description: A fast Cairo VM written in OCaml
site_url: https://teddyjfpender.github.io/cairo-vm-ocaml/
repo_url: https://github.com/teddyjfpender/cairo-vm-ocaml
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: deep orange
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: deep orange
      toggle: { icon: material/weather-sunny, name: Light mode }
  features: [navigation.instant, navigation.sections, navigation.footer, content.code.copy]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Learn:
      - Overview: learn/index.md
      - Walk through a VM in OCaml: vm-walkthrough.md
      - Generate and replay a PIE: pie-walkthrough.md
      - 1. The Cairo machine: learn/cairo-machine.md
      - 2. Values and Felt.t: learn/values.md
      - 3. Memory and segments: learn/memory.md
      - 4. Instructions and the CPU: learn/instructions.md
      - 5. Builtins and hints: learn/builtins-and-hints.md
      - 6. Runs, relocation and proofs: learn/runs-and-proofs.md
  - Architecture: architecture.md
  - Reference:
      - Version 0.3 release: release-0.3.md
      - Version 0.2 qualification: release-0.2.md
      - VM execution contract: EXECUTION_CONTRACT.md
      - OS host protocol: os-host.md
      - Binary OS witness: witness-wire.md
      - Parity: parity.md
      - Benchmarks: benchmarks.md
  - Contributing: contributing.md
